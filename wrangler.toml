name = "stroke-web"
account_id = "16b2c363a412bfaaec2a5a2572964728"
compatibility_date = "2025-10-01"
main = "@tanstack/react-start/server-entry"
compatibility_flags = ["nodejs_compat"]
preview_urls = true

# Official custom domain (zone already configured in Cloudflare)
routes = [{ pattern = "stroke.click", custom_domain = true }]

# Powers the free AI tier (/api/ai/*). The free neuron allocation is per ACCOUNT
# and shared across all users, so src/lib/ai/free-tier.ts caps usage app-wide.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "stroke-web"
database_id = "9b155570-5614-4d21-b61c-6eb98bb365cd"
migrations_dir = "drizzle"

[vars]
VITE_BASE_URL = "https://stroke.click"
DODO_ENVIRONMENT = "live_mode"
# Secrets: set via wrangler secret put <NAME>
# DODO_PAYMENTS_API_KEY, DODO_WEBHOOK_KEY, DODO_PRODUCT_ID, LICENSE_PRIVATE_KEY_HEX
# DODO_TEAM_PRODUCT_ID (optional) — enables the $99 Team plan covering an email domain
# OPENROUTER_POOL_KEY (optional) — free-tier overflow once the Workers AI daily cap
#   trips. Without it, the free tier simply 429s instead of falling back.
# GITHUB_TOKEN (optional) — raises the GitHub API rate limit for /api/releases

[assets]
directory = "./public"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
